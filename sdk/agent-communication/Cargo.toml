[package]
name = "agent-communication"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56.0", features = ["tcp", "websocket", "noise", "yamux", "request-response", "mdns", "tokio",""] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4.41"
async-trait = "0.1.88"
bytes = "1.10.1"
anyhow = "1.0.98"