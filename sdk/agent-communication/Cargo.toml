[package]
name = "agent-communication"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56.0", features = [
    "tcp", "websocket", "noise", "yamux", "request-response", "dns", "mdns", "tokio", "macros"
] }
libp2p-swarm = "0.47.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }
chrono = "0.4.41"
async-trait = "0.1.88"
bytes = "1.10.1"
anyhow = "1.0.98"
tokio-util = "0.7.15"
futures = "0.3.31"
uuid = "1.17.0"